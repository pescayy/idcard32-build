name: build-idcard32
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build-quanneng:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout model parts
        uses: actions/checkout@v4
        with:
          ref: assets
          path: modelparts
      - name: Assemble AI model
        run: python -c "import base64,glob,hashlib,os; parts=sorted(glob.glob('modelparts/models/b64/model.b64.*')); data=b''.join(open(p,'rb').read() for p in parts); raw=base64.b64decode(data); os.makedirs('models',exist_ok=True); open('models/carddetection_scrfd34gkps.onnx','wb').write(raw); print(len(parts),'parts ->',len(raw),'bytes'); assert hashlib.md5(raw).hexdigest()=='bb47635d61f21d63d3993162c28303ff', 'model md5 mismatch'"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'
      - name: Show python bitness
        run: python -c "import struct,sys; print(sys.version); print(struct.calcsize('P')*8)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install onnxruntime==1.14.1 rapidocr-onnxruntime==1.4.4 openpyxl==3.1.5 pywin32==306
      - name: Stage OCR models
        run: python -c "import rapidocr_onnxruntime,os,shutil; src=os.path.join(os.path.dirname(rapidocr_onnxruntime.__file__),'models'); shutil.copytree(src,'ocr_models'); print(sorted(os.listdir('ocr_models')))"
      - name: Build exe with PyInstaller
        run: pyinstaller --noconfirm --onedir --windowed --name IDCardProcessor32QN --collect-all tkinterdnd2 --collect-all onnxruntime --collect-all rapidocr_onnxruntime --hidden-import win32print --hidden-import win32ui --hidden-import win32con --hidden-import pywintypes --hidden-import pythoncom --add-data "models/carddetection_scrfd34gkps.onnx;models" --add-data "ocr_models;rapidocr_onnxruntime/models" IDCardProcessor_full.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDCardProcessor32-win7-quanneng
          path: dist/IDCardProcessor32QN/
  build-qt:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout model parts
        uses: actions/checkout@v4
        with:
          ref: assets
          path: modelparts
      - name: Assemble AI model
        run: python -c "import base64,glob,hashlib,os; parts=sorted(glob.glob('modelparts/models/b64/model.b64.*')); data=b''.join(open(p,'rb').read() for p in parts); raw=base64.b64decode(data); os.makedirs('models',exist_ok=True); open('models/carddetection_scrfd34gkps.onnx','wb').write(raw); print(len(parts),'parts ->',len(raw),'bytes'); assert hashlib.md5(raw).hexdigest()=='bb47635d61f21d63d3993162c28303ff', 'model md5 mismatch'"
      - name: Assemble app icon
        run: python -c "import base64,hashlib; import glob; [open(p[:-4],'wb').write(base64.b64decode(open(p,'rb').read())) for p in glob.glob('icons/*.b64')]; print('icons assembled:', sorted(glob.glob('icons/*.ico')+glob.glob('icons/*.png')))"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.10'
          architecture: 'x86'
      - name: Show python bitness
        run: python -c "import struct,sys; print(sys.version); print(struct.calcsize('P')*8)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-qt.txt
      - name: Build with PyInstaller (onedir)
        run: pyinstaller --noconfirm --onedir --windowed --name IDCardMuse --icon icons/app.ico --collect-all onnxruntime --collect-all rapidocr_onnxruntime --exclude-module tkinter --exclude-module _tkinter --exclude-module onnxruntime.transformers --exclude-module onnxruntime.tools --exclude-module onnxruntime.quantization --exclude-module onnxruntime.backend --exclude-module onnxruntime.datasets --hidden-import lic_wedgecut --hidden-import lic_edge_refine --add-data "models/carddetection_scrfd34gkps.onnx;models" --add-data "icons;icons" app_qt.py
      - name: Verify onedir layout + slimming gate
        run: |
          Get-ChildItem dist/IDCardMuse | Select-Object Name,Length | Format-Table -AutoSize
          $m = Get-Item dist/IDCardMuse/models/carddetection_scrfd34gkps.onnx
          Write-Host "model bytes next to exe: $($m.Length)"
          $files = Get-ChildItem dist/IDCardMuse -Recurse -File
          $total = ($files | Measure-Object Length -Sum).Sum
          Write-Host "onedir total bytes: $total"
          Write-Host "onedir file count: $($files.Count)"
          if (Test-Path dist/IDCardMuse/tcl) { throw "SLIM GATE FAIL: tcl directory present" }
          if (Test-Path dist/IDCardMuse/tk) { throw "SLIM GATE FAIL: tk directory present" }
          if (Test-Path dist/IDCardMuse/tcl8) { throw "SLIM GATE FAIL: tcl8 directory present" }
          if ($files.Count -gt 1000) { throw "SLIM GATE FAIL: file count $($files.Count) over 1000" }
      - name: Write installer script
        run: python -c "import base64; open('installer-build.iss','wb').write(base64.b64decode(''))"
      - name: Build installer (Inno Setup)
        run: |
          $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue; if ($cmd) { $iscc = $cmd.Source } }
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = @("C:\Program Files (x86)\Inno Setup 6\ISCC.exe", "C:\Program Files\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1 }
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) not found" }
          Write-Host "ISCC: $iscc"
          $isl = Join-Path (Split-Path $iscc) "Languages\ChineseSimplified.isl"
          if (-not (Test-Path $isl)) { (Get-Content installer-build.iss -Raw) -replace "(?s)\[Languages\].*", "" | Set-Content installer-build.iss -Encoding UTF8; Write-Host "ChineseSimplified.isl missing; installer will use default language" }
          & $iscc /DSourceDir="$PWD\dist\IDCardMuse" /DOutDir="$PWD\installer-out" /DOutBase="IDCardMuse-1118-Setup32" /DAppVer="1118" installer-build.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem installer-out | Select-Object Name,Length | Format-Table -AutoSize
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: IDCardMuse-win7-qt-setup
          path: installer-out/*.exe


